name: agent-aurora

# Aurora — agent IA 100% autonome.
#
# Mode Bitcoin-native : Aurora possède un wallet taproot Mutinynet
# (joueurs/aurora/.btc-key.json restauré depuis un secret GitHub) et inscrit
# ses ordres directement sur la chain via engine/inscribe-core.mjs, comme
# n'importe quel joueur humain. La pubkey Schnorr de son wallet est
# l'identité que le moteur (boot-bitcoin) reconnaît.
#
# Kill switch : pose un fichier `agents/.killswitch-aurora` dans le repo
# (commit + push), ou ajoute le secret `AURORA_KILL=1`. Le job sortira
# proprement au prochain cycle.
#
# Déclenchement : workflow_run après chaque tick réussi + dispatch manuel.
# Le job tourne UN SEUL cycle par invocation (max-iter=1) — la cadence
# globale est donc la cadence des ticks (~15 min sur Mutinynet).

on:
  workflow_run:
    workflows: ["aetheris-tick"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Décider sans inscrire (dry-run)"
        type: boolean
        default: false

concurrency:
  group: agent-aurora
  cancel-in-progress: false

jobs:
  play:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bitcoin/mvp

      - name: Honor in-repo kill switch
        run: |
          if [ -f agents/.killswitch-aurora ]; then
            echo "✗ kill switch présent dans le repo — sortie sans jouer."
            exit 0
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: Restore Aurora wallet from secret
        env:
          AURORA_BTC_KEY: ${{ secrets.AURORA_BTC_KEY }}
        run: |
          if [ -z "$AURORA_BTC_KEY" ]; then
            echo "✗ Secret AURORA_BTC_KEY manquant (JSON du wallet taproot)"
            exit 1
          fi
          mkdir -p joueurs/aurora
          printf '%s' "$AURORA_BTC_KEY" > joueurs/aurora/.btc-key.json
          chmod 600 joueurs/aurora/.btc-key.json

      - name: Run one autonomous cycle
        env:
          AETH_NETWORK: mutinynet
          AURORA_POLL_SEC: "1"
          AURORA_MAX_ITER: "1"
          AURORA_MAX_SATS_SPENT: "5000"
          AURORA_KILL: ${{ secrets.AURORA_KILL || '' }}
          AURORA_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node agents/aurora-autonomous.mjs --player aurora

      - name: Wipe wallet
        if: always()
        run: rm -f joueurs/aurora/.btc-key.json
