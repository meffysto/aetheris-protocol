name: aetheris-tick

# Avance d'un tick toutes les 15 minutes.
# Tout le monde peut auditer ce workflow ; le résolveur étant déterministe,
# n'importe qui peut le rejouer localement et vérifier que le résultat coïncide.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # déclenchement manuel autorisé (admins serveur uniquement)

jobs:
  tick:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Résoudre le tick
        run: node engine/tick.mjs --apply

      - name: Commit & push
        run: |
          git config user.name "aetheris-engine"
          git config user.email "engine@aetheris.local"
          TICK=$(grep '^tick:' world/manifest.yaml | awk '{print $2}')
          if git diff --quiet; then
            echo "Aucun changement — tick vide."
            exit 0
          fi

          # Sujet de commit varié à partir des events du tick (résumé humain).
          # Évite des centaines de commits "tick N" identiques qui ressemblent
          # à du spam pour les heuristiques anti-abuse.
          TICK_PADDED=$(printf "%04d" "$TICK")
          EVENT_FILE="world/events/tick-${TICK_PADDED}.md"
          SUBJECT="tick $TICK"
          if [ -f "$EVENT_FILE" ]; then
            COUNT=$(grep -c '^- \*\*' "$EVENT_FILE" || true)
            FIRST_TYPE=$(grep -m1 '^- \*\*' "$EVENT_FILE" | sed -n 's/^- \*\*\([^*]*\)\*\*.*/\1/p')
            if [ -n "$FIRST_TYPE" ]; then
              if [ "$COUNT" -gt 1 ]; then
                SUBJECT="tick $TICK — $FIRST_TYPE (+$((COUNT - 1)))"
              else
                SUBJECT="tick $TICK — $FIRST_TYPE"
              fi
            fi
          fi

          git add -A
          if [ -f "$EVENT_FILE" ]; then
            git commit -m "$SUBJECT" -m "$(cat "$EVENT_FILE")"
          else
            git commit -m "$SUBJECT"
          fi
          git push
