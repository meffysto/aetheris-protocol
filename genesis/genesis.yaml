# Citadel Protocol — Genesis Block
# Inscrit sur Bitcoin comme op_type=0x01 (join/genesis).
# Le `seed` est la pubkey Schnorr du fondateur (= inscripteur de cette TX),
# ce qui rend la genesis auto-cohérente : le seed peut être vérifié contre
# le witness de la TX qui contient cette inscription.

version: 1
type: join
serveur: citadel-mvp-1
protocol_version: 0.1
tick: 0
seed: 0x5cb4da974b1fc38ab710729c6c3fba911bb40ab924bca1103cecace80bd5d6b7
demarrage_iso: 2026-05-09T00:00:00Z
reseau: mutinynet

parametres:
  tick_source: bitcoin
  # Mutinynet cible 30s/bloc → 6 blocs = ~3 min/tick. La balance rules.yaml
  # est calibrée pour ~2.5 min/UTJ (donc ~15 min/tick = 6 UTJ × 2.5 min) ;
  # à 3 min/tick le jeu est ~5× plus rapide qu'à l'intent originel — c'est
  # un compromis "Bitcoin live" jouable en session. Voir rules.yaml ligne 6.
  blocs_par_tick: 6
  galaxies: 9
  systemes_par_galaxie: 499
  positions_par_systeme: 15
  planetes_max_par_joueur: 9

# Ancrage Bitcoin — sera mis à jour après inscription on-chain.
ancrage:
  bloc_genesis: 3085121
  tx_genesis: b6a5e25bb67ca9aaefabdb9ef692928d9d4053dfc145f5034271859e3ccd8430
  reseau_explorer: https://mutinynet.com
